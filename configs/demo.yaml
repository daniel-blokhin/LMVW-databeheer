version: 1
input:
  plans: ../data/sample/plans.csv
  sheet: Planlijst
  delimiter: ;
output_dir: ../data/runs
mapping: columns.yaml
quality: quality.yaml
snapshot_utc: '2026-10-16T09:00:00Z'
sources:
  mode: fixtures
  fixtures_dir: ../data/sample/api
  bag: true
  brk: true
  dso: true
  rp: true
  dso_environment: PRE
  fetch_publication_text: true
  only_residential_vbo: true
geo:
  buffer_m: 50
  tile_size_m: 500
  min_overlap_m2: 0.01
  max_tiles: 500
  max_scope_km2: 100
  include_rejected_plans: false
http:
  page_size: 1000
  max_pages: 100
  max_features: 250000
  max_response_bytes: 50000000
  attempts: 4
  pause_seconds: 0.05
