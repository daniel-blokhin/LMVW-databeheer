[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmvw-geospatial-pipeline"
version = "0.1.0"
description = "Reproducible Dutch housing data integration, quality control and spatial matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.4,<3",
  "PyYAML>=6.0.2,<7",
  "openpyxl>=3.1.5,<4",
  "shapely>=2.1,<3",
  "pyproj>=3.6,<4",
  "geopandas>=1.0,<2",
  "pyogrio>=0.10,<1",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage>=7.6,<8"]

[project.scripts]
lmvw = "lmvw_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
