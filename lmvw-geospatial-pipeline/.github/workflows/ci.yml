name: Offline pipeline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Repository hygiene
        run: python scripts/check_repository.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Unit, security, contract and offline integration tests
        run: python -m coverage run --source=lmvw_pipeline -m pytest -q
      - name: Coverage gate
        run: python -m coverage report --fail-under=85
      - name: Rebuild SQL contract
        run: python -m lmvw_pipeline schema --output sql/schema.sql
      - name: Check SQL contract is committed correctly
        run: git diff --exit-code -- sql/schema.sql
      - name: Verify committed synthetic example
        run: python -m lmvw_pipeline verify-bundle examples/database_ready
# No production credentials, no private input data and no live integration calls.
